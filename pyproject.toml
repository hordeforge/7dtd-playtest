[project]
name = "zdtd-playtest-orchestrator"
version = "0.1.0"
description = "Host orchestrator for stock-client zdtd playtest suites"
requires-python = ">=3.11"
dependencies = []
[dependency-groups]
# Only third-party packages in the repo. Declared here (not `uv run --with`)
# so uv.lock pins the exact version with sha256 hashes instead of resolving
# unpinned from PyPI on every `make test`.
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "coverage==7.16.0",
]

[tool.uv]
package = false
# The uv that wrote the committed uv.lock. A floating uv lets the resolver
# change under the gates without any commit, the same reason the workflows pin
# ubuntu-24.04 over ubuntu-latest. A contributor on a different minor fails
# here with uv's own upgrade hint rather than silently re-resolving.
required-version = ">=0.12.13,<0.13"

# Lint gate (make lint): defect-oriented rules only. E/W/F/I/B/SIM/UP/RUF plus
# the free strictness of C4/RET/A/DTZ/FA/PIE and the error-only subsets of pylint
# (PLE), pep8-naming-adjacent (RSE), import hygiene (TID), __slots__ (SLOT) and
# isinstance/issubclass traps (YTT), plus the defect-bearing members of S, TRY,
# PERF and PLR that the tree already passes (the rest of those categories are
# style or have findings of their own). Style suites that would fight the
# hand-rolled gate scripts (D) are deliberately not selected, as are the
# suites the tree does not yet pass (ARG, ANN, BLE, EXE, FBT, EM, PT, FURB); a
# group lands here once a run proves it clean, not on faith.
# Lines hard-capped at 100 so two copies fit side-by-side.
[tool.ruff]
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "RUF", # ruff-specific (unused noqa, pairwise, ...)
    "RET", # return simplification
    "A",   # builtin shadowing
    "DTZ", # naive datetime
    "FA",  # future annotations
    "G",   # logging format correctness
    "PIE", # flake8-pie (dead placeholders, duplicate fields, needless spread)
    "PLE", # pylint errors only (used-before-assignment, ...)
    "RSE", # unnecessary paren on raised exception
    "TID", # tidy imports (no relative-import tricks)
    "ERA", # commented-out code left behind by a revert
    "FIX", # no TODO/FIXME markers left in the tree
    "TD",  # no TODO markers, and no banned debug module import
    "ISC001", # two string literals fused on one line inside a call
    "SLOT",# manual __slots__ subclassing of immutable types
    "YTT", # truthy tests on sys/typing internals
    "PGH", # no blanket noqa / bare type: ignore (suppression hygiene)
    "T10", # no debugger imports/breakpoints in shipped orchestrator code
    # Rules pulled out of categories the tree does not yet pass whole (S, TRY,
    # PERF and PLR each still have findings of their own). These are the
    # defect-bearing members of those categories, and a run proves the tree is
    # already clean for them, so they gate from today.
    "S307",  # eval/exec on a runtime value
    "TRY400", # logger.error inside except swallows the traceback
    "PERF102", # dict mutated while iterated
    "PERF203", # try/except inside a loop, re-raised per iteration
    "PLR5501", # else: if() chains instead of else if
]

# Coverage floor (make coverage). The badge published from this number read as
# a report card nobody could fail: a dropped line lowered it silently. The
# floor is one point under the measured 82.75%, so a collapse blocks the job
# that publishes it while a measurement wobble of a tenth of a point does not.
# Ratchet it up, never down; the number only moves when the tree does.
[tool.coverage.report]
fail_under = 82

# Type gate (make typecheck). The tree passes mypy's complete strict preset;
# ratchet up as annotations spread. The two Any-oriented strict flags are on
# globally with per-module opt-outs below for modules that still carry gaps:
# shrink a module's count to zero, then drop it from its override list.
# Remaining debt today: 31 missing type-arguments across the four generics
# opt-outs, 17 explicit Any in dst/playtest_compare/suite_loader.
[tool.mypy]
python_version = "3.11"
files = ["scripts"]
strict = true
disallow_any_generics = true
disallow_any_explicit = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
strict_equality_for_none = true
disallow_any_unimported = true
disallow_untyped_globals = true
no_implicit_optional = true
no_implicit_reexport = true
extra_checks = true
# Scream when an override above stops matching any file (rename, deletion):
# a dead opt-out hides the fact that a module graduated back to strict.
warn_unused_configs = true
enable_error_code = [
    "possibly-undefined",
    "ignore-without-code",
    "truthy-bool",
    "unimported-reveal",
    "deprecated",
    "mutable-override",
    "type-abstract",
    # An `await` whose result is discarded compiles, runs, and silently does
    # nothing, which in the lock's acquire/release path is a hold that is never
    # taken or a release that never happens. Verified clean across scripts/.
    "unused-awaitable",
]

# Ratchet opt-outs (see comment above [tool.mypy]). Every entry is a module
# that still fails the named flag; remove entries, never add them.
[[tool.mypy.overrides]]
module = [
    "playtest_compare",
    "playtest_run",
    "test_playtest_compare",
    "suite_loader",
]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["dst", "playtest_compare", "suite_loader"]
disallow_any_explicit = false
