[project]
name = "zdtd-playtest-orchestrator"
version = "0.1.0"
description = "Host orchestrator for stock-client zdtd playtest suites"
requires-python = ">=3.11"
dependencies = []
[dependency-groups]
# Only third-party packages in the repo. Declared here (not `uv run --with`)
# so uv.lock pins the exact version with sha256 hashes instead of resolving
# unpinned from PyPI on every `make test`.
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "mypy==2.1.0",
    "coverage==7.15.4",
]

[tool.uv]
package = false

# Lint gate (make lint): defect-oriented rules only. E/W/F/I/B/SIM/UP/RUF plus
# the free strictness of C4/RET/A/DTZ/FA/PIE and the error-only subsets of pylint
# (PLE), pep8-naming-adjacent (RSE), import hygiene (TID), __slots__ (SLOT) and
# isinstance/issubclass traps (YTT). Style suites that would fight the
# hand-rolled gate scripts (D, ANN, S, TRY) are deliberately not selected.
# Lines hard-capped at 100 so two copies fit side-by-side.
[tool.ruff]
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "RUF", # ruff-specific (unused noqa, pairwise, ...)
    "RET", # return simplification
    "A",   # builtin shadowing
    "DTZ", # naive datetime
    "FA",  # future annotations
    "G",   # logging format correctness
    "PIE", # flake8-pie (dead placeholders, duplicate fields, needless spread)
    "PLE", # pylint errors only (used-before-assignment, ...)
    "RSE", # unnecessary paren on raised exception
    "TID", # tidy imports (no relative-import tricks)
    "SLOT",# manual __slots__ subclassing of immutable types
    "YTT", # truthy tests on sys/typing internals
    "PGH", # no blanket noqa / bare type: ignore (suppression hygiene)
    "T10", # no debugger imports/breakpoints in shipped orchestrator code
]

# Type gate (make typecheck). The tree passes mypy's complete strict preset;
# ratchet up as annotations spread. The two Any-oriented strict flags are on
# globally with per-module opt-outs below for modules that still carry gaps:
# shrink a module's count to zero, then drop it from its override list.
# Remaining debt today: ~43 missing type-arguments across the four generics
# opt-outs, ~11 explicit Any in dst/playtest_compare.
[tool.mypy]
python_version = "3.11"
files = ["scripts"]
strict = true
disallow_any_generics = true
disallow_any_explicit = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
strict_equality_for_none = true
disallow_any_unimported = true
disallow_untyped_globals = true
no_implicit_optional = true
no_implicit_reexport = true
extra_checks = true
# Scream when an override above stops matching any file (rename, deletion):
# a dead opt-out hides the fact that a module graduated back to strict.
warn_unused_configs = true
enable_error_code = [
    "possibly-undefined",
    "ignore-without-code",
    "truthy-bool",
    "unimported-reveal",
    "deprecated",
]

# Ratchet opt-outs (see comment above [tool.mypy]). Every entry is a module
# that still fails the named flag; remove entries, never add them.
[[tool.mypy.overrides]]
module = [
    "playtest_compare",
    "playtest_log",
    "playtest_run",
    "test_playtest_compare",
    "suite_loader",
    "test_suite_loader",
]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["dst", "playtest_compare", "suite_loader", "test_suite_loader"]
disallow_any_explicit = false
