name: ci
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The offline gates need no game install: catalog<->SCENARIOS surface
      # (live rows + counts total), scenario-provider env surface, the host
      # lock, the deterministic simulation, and the compare diff (pytest via
      # uv). The mod build itself is not CI-able (references game DLLs), but
      # these gates catch the doc/catalog drift that used to ship silently.
      - run: make test
      # Wider seed sweep than the gate inside `make test`. Cheap: the whole
      # thing is virtual time, so 200 seeds is ~200 simulated hours in
      # seconds of wall clock.
      - run: make dst DST_SEEDS=200
