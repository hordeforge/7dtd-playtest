name: ci

on: [push, pull_request]

# One run per ref: a force-push on a PR cancels the superseded run instead of
# racing it for the same cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checkout is read-only here; the gates never touch the GitHub API. Least
# privilege up front so a repo-default write-all token can never leak into
# this run.
permissions:
  contents: read

env:
  # The uv that wrote the committed uv.lock, and the floor pyproject declares
  # in [tool.uv] required-version. One pin for both jobs instead of a literal
  # per setup-uv step; test_version_surface.py fails when this and
  # required-version drift apart, so a bump lands in both files at once.
  UV_VERSION: "0.12.13"

jobs:
  offline-tests:
    # Pinned image: ubuntu-latest floats (currently 24.04, was 22.04) and a
    # runner bump changes the toolchain under the gates without any commit.
    runs-on: ubuntu-24.04
    # The whole check is virtual time (~seconds locally); this only caps a
    # hung step (stuck download, waiting gate) at minutes instead of GitHub's
    # 6-hour default.
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs (mutable major tags are a supply-chain risk).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          # A floating uv lets the resolver move under the gates without any
          # commit; the pin lives in this workflow's UV_VERSION.
          version: ${{ env.UV_VERSION }}
      # setup-uv caches uv's wheel/install store automatically on GitHub-hosted
      # runners (enable-cache defaults to auto), keyed off the uv.lock file.
      # `make test` = ruff lint + mypy typecheck (both pinned in the dev
      # dependency-group, configured in pyproject.toml) plus the offline
      # suites: catalog<->SCENARIOS surface (live rows + counts total), mod
      # version/changelog sync, the scenario-provider env surface, the
      # mining-probe provider surface, the stock-peer orchestration surface,
      # the host lock, the deterministic simulation, the orchestrator
      # local-init order gate, the orchestrator report/log surface, the
      # orchestrator pure-logic units, the compare diff (pytest via uv),
      # the capture-clip marker surface, the video-review surface, the
      # player-survivability helper surface, and the gate-list surface (every
      # scripts/test_*.py is in the Makefile GATES list, and these steps are
      # the ones `make check` runs).
      # The mod build itself is not CI-able (references game DLLs), but these
      # gates catch the doc/catalog drift that used to ship silently.
      - run: make test
      # Wider seed sweep than the gate inside `make test`. Cheap: the whole
      # thing is virtual time, so 200 seeds is ~200 simulated hours in
      # seconds of wall clock.
      - run: make dst DST_SEEDS=200

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Pinned to commit SHAs (mutable major tags are a supply-chain risk).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          # A floating uv lets the resolver move under the gates without any
          # commit; the pin lives in this workflow's UV_VERSION.
          version: ${{ env.UV_VERSION }}
      - run: make coverage
      - run: >-
          uv run --locked --project "$PWD"
          python scripts/coverage_badge.py "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The token rides in an Authorization header, never in a remote URL.
          # A URL reaches the process table of every git it is passed to and is
          # written into badge-repo/.git/config, where a `git remote -v` or a
          # config dump in a failure log prints it. GIT_CONFIG_* hands the
          # header to git through the environment, so it lands in no argv and
          # in no file on disk.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0="$auth"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git remote remove origin 2>/dev/null || true
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
