# Three dependency surfaces: the Python runner (uv.lock), the .NET mod
# project, and the SHA-pinned CI actions.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-packages:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directories:
      - /Source/PlayTestMod
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
